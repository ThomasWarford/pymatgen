# Default VASP settings for static calculations with SlabPES
# using the Regularized-Restored Strongly Constrained and Appropriately
# Normed functional (default PBE or R2SCAN).
PARENT: PBE64Base
INCAR:
  ALGO: Normal # Normal for PBE, ALL for R2SCAN, included to have some reasonable default
  EDIFF: 1.e-05
  EFERMI: MIDGAP
  ENCUT: 680
  GGA: PE # PBE as default
  GGA_COMPAT: False
  ISEARCH: 1 # only relevant when ALGO=All (r2SCAN calcs)
  ISMEAR: 0 # included to have some reasonable default
  ISPIN: 2
  KSPACING: 0.22 # included to have some reasonable default
  LAECHG: True
  LASPH: True
  LCHARG: False
  LCHARGH5: True
  LELF: True # restricts calculation to KPAR = 1
  LH5: False
  LMAXMIX: 6 # per benchmark
  LMIXTAU: True
  LOCPOT: True
  LORBIT: 11
  LREAL: False # per benchmark
  LWAVE: True
  NELM: 200
  NEDOS: 2000
  NSW: 0 # static calculation
  PREC: Accurate
  SIGMA: 0.05 # included to have some reasonable default
  WRT_POTENTIAL: total ionic hartree xc
